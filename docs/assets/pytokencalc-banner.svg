<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">PyTokenCalc — know your LLM costs before you hit send</title>
  <desc id="desc">PyTokenCalc banner: token counting and cost estimation across providers.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0a1f"/>
      <stop offset="1" stop-color="#1b1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <rect x="0" y="0" width="8" height="280" rx="4" fill="url(#accent)"/>
  <g transform="translate(72 78)">
    <rect x="0" y="0" width="124" height="124" rx="28" fill="#1b1035" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="2"/>
    <circle cx="50" cy="62" r="24" fill="none" stroke="#60a5fa" stroke-width="6"/>
    <path d="M50 50v24M42 62h16" stroke="#c4b5fd" stroke-width="5" stroke-linecap="round"/>
    <path d="M76 84h18M76 96h12M85 40v44" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="232" y="122" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="750" fill="#f5f3ff" letter-spacing="-1">PyTokenCalc</text>
  <text x="234" y="170" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" fill="#c4b5fd">Know your LLM costs before you hit send.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" fill="#93c5fd">
    <text x="234" y="216">20+ providers · token counting · pricing · preflight · reconciliation</text>
  </g>
</svg>
