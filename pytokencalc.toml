[mcp]
enabled = true
port = 8778
discovery_method = "stdio"

[mcp.tools]
count_tokens = true
estimate_cost = true
compare_model_costs = true
get_model_pricing = true
track_budget = true
set_budget_alert = true
analyze_token_usage = true
optimize_prompt = true
batch_count_tokens = true
get_token_breakdown = true
export_pricing_report = true
estimate_total_cost = true

[mcp.security]
# Auth is required by default. Set to false only if you understand the
# MCP server will be reachable without authentication, e.g. because you've
# restricted network access some other way.
require_auth = true
