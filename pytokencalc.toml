[mcp]
enabled = true
port = 8778
discovery_method = "stdio"

[mcp.tools]
count_tokens = true
estimate_cost = true
compare_model_costs = true
get_model_pricing = true
track_budget = true
set_budget_alert = true
analyze_token_usage = true
optimize_prompt = true
batch_count_tokens = true
get_token_breakdown = true
export_pricing_report = true
estimate_total_cost = true

[mcp.security]
# DEPRECATED / DOCUMENTATION ONLY. This file is not currently loaded by the
# MCP server, and the server does not implement authentication.
#
# Safety default: bind to 127.0.0.1. Non-loopback HTTP/SSE binds are refused
# unless PYTOKENCALC_MCP_ALLOW_UNAUTHENTICATED=1 is set, because there is no
# built-in auth layer. See SECURITY.md.
